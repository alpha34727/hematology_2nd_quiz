<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>血液學二段疾病樹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Hematology II <span style="font-weight:500;color:var(--muted)">血液學二段・疾病圖譜</span></h1>
  <span class="spacer"></span>
  <span class="exf" id="exf" role="group" aria-label="考古題標註">
    <span class="exl">考古題</span>
    <button type="button" class="yb" data-y="105" aria-pressed="true">105</button><button type="button" class="yb" data-y="109" aria-pressed="true">109</button><button type="button" class="yb" data-y="110" aria-pressed="true">110</button>
    <button type="button" class="yb only" id="exOnly" aria-pressed="false">只看考過</button>
  </span>
  <span class="seg"><button id="viewMap">心智圖</button><button id="viewList">清單</button><button id="viewFocus">考前重點</button></span>
  <button class="back" id="backBtn">← 返回樹狀圖</button>
  <button id="themeBtn" title="切換深淺色">◐</button>
</header>
<div class="layout">
<aside>
  <div class="search">
    <input id="q" type="search" placeholder="搜尋疾病、基因、標記… 如 t(8;21)、CD103、JAK2">
    <button id="expAll">全部展開</button>
    <button id="colAll">全部收合</button>
  </div>
  <div class="tree" id="tree"></div>
</aside>
<main id="main"></main>
</div>
<div id="mapView">
  <div class="mmtool">
    <input id="mmq" type="search" placeholder="搜尋（Enter 跳下一個）">
    <span class="hc" id="mmhc"></span>
    <button id="mmExp" title="展開全部">全部展開</button>
    <button id="mmCol" title="只留第一層">收合</button>
    <button id="mmFit" title="縮放至全部可見">適合畫面</button>
    <button id="mmIn" title="放大">＋</button>
    <button id="mmOut" title="縮小">－</button>
  </div>
  <div id="vp"><div id="stage"><svg id="links"></svg></div></div>
  <div class="mmhelp">拖曳平移・滾輪縮放・點分類展開/收合・點 <i>i</i> 或疾病看詳細內容</div>
  <aside id="drawer"><button class="close" id="drClose" title="關閉（Esc）">✕</button><div id="drBody"></div></aside>
</div>
<div id="focusView"></div>
<script src="js/data.js"></script>
<script src="js/exams.js"></script>
<script src="js/exam.js"></script>
<script src="js/app.js"></script>
<script src="js/mindmap.js"></script>
<script src="js/focus-data.js"></script>
<script src="js/focus-wbc.js"></script>
<script src="js/focus.js"></script>
<script src="js/main.js"></script>
</body>
</html>
